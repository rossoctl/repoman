name: shellcheck

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck (vendor tooling)
        # Explicit paths — never a glob. Do not lint skills/repoman/scripts/
        # here; the engine is linted in rossoctl/automation.
        run: shellcheck --severity=warning scripts/vendor-engine.sh tests/test-vendor-engine.sh
